name: Build HomeNX 360

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional prerelease tag, for example v0.8.1-preview.1'
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/homenx360.yml'
      - 'homenx360/**'
      - 'tools/**'

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64
    timeout-minutes: 90
    env:
      HOMENX360_RELEASE_TAG: ${{ inputs.release_tag }}
      PKG_CONFIG_LIBDIR: /opt/devkitpro/portlibs/switch/lib/pkgconfig:/opt/devkitpro/libnx/lib/pkgconfig
      PKG_CONFIG_PATH: /opt/devkitpro/portlibs/switch/lib/pkgconfig:/opt/devkitpro/libnx/lib/pkgconfig
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y curl gcc g++ zip unzip zstd cmake ninja-build python3 zlib1g-dev nlohmann-json3-dev gh libminizip-dev libcurl4-openssl-dev libssl-dev
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: 3.1.2
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 -c 'import os,re; tag=os.environ.get("RELEASE_TAG", ""); assert not tag or re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:-preview\.[0-9]+)?",tag), "Invalid release tag"'
      - name: Prepare pinned upstream source and dashboard overlay
        run: |
          git config --global --add safe.directory '*'
          python3 tools/prepare_homenx360.py
      - name: Check controller navigation
        working-directory: build/homenx360-source
        run: |
          g++ -std=c++20 tests/dashboard360_test.cpp -o /tmp/dashboard360-test
          /tmp/dashboard360-test
          g++ -std=c++20 tests/startup360_test.cpp -o /tmp/startup360-test
          /tmp/startup360-test projects/cards/romfs/boot/nxe360.bin
          g++ -std=c++20 tests/guide360_test.cpp -o /tmp/guide360-test
          /tmp/guide360-test
          g++ -std=c++20 tests/guide_discord360_test.cpp -o /tmp/guide-discord360-test
          /tmp/guide-discord360-test
          g++ -std=c++20 -DSWITCHU_MENU tests/guide_discord360_test.cpp -o /tmp/guide-discord360-home-test
          /tmp/guide-discord360-home-test
          g++ -std=c++20 tests/settings360_test.cpp -o /tmp/settings360-test
          /tmp/settings360-test
          g++ -std=c++20 -DSWITCHU_MENU tests/settings360_test.cpp -o /tmp/settings360-home-test
          /tmp/settings360-home-test
          g++ -std=c++20 -O2 tests/avatar360_test.cpp -lz -o /tmp/avatar360-test
          /tmp/avatar360-test projects/cards/romfs/avatars
          python3 tests/avatar_media360_test.py
          g++ -std=c++20 -O2 -idirafter lib/nxui/include tests/avatar_catalog360_test.cpp -lz -o /tmp/avatar-catalog360-test
          /tmp/avatar-catalog360-test media/avatar-catalog
          g++ -std=c++20 -O2 tests/avatar_settings360_test.cpp -o /tmp/avatar-settings360-test
          /tmp/avatar-settings360-test
          python3 tests/updater360/make_fixtures.py /tmp/updater360-fixtures
          g++ -std=c++20 -O2 -Wno-deprecated-declarations -Itests/updater360 tests/updater360/updater360_test.cpp -lcurl -lminizip -lcrypto -lz -pthread -o /tmp/updater360-test
          /tmp/updater360-test /tmp/updater360-fixtures
          python3 tests/updater360/package360_test.py
      - name: Configure
        working-directory: build/homenx360-source
        run: xmake f --yes -vD -p cross -m release -a aarch64 --toolchain=devkita64 --homebrew=n --root
      - name: Build and embed the loader
        working-directory: build/homenx360-source
        run: |
          xmake build --root HomeNX-Loader
          mkdir -p projects/menu/src/generated
          python3 tools/embed_loader.py build/cross/aarch64/release/HomeNX-Loader.nro projects/menu/src/generated/loader_nro.inc
      - name: Build the app and HOME frontend with its daemon
        working-directory: build/homenx360-source
        run: |
          xmake build --root -j2 CardsNX
          xmake build --root -j2 SwitchU
          xmake build --root -j2 HomeNX360-Updater
      - name: Package the existing-install update
        working-directory: build/homenx360-source
        run: python3 tools/package_dashboard360.py --output ../artifacts --revision "$SOURCE_REVISION"
        env:
          SOURCE_REVISION: ${{ github.sha }}
          HOMENX360_RELEASE_TAG: ${{ inputs.release_tag }}
      - name: Package complete corresponding source and checksums
        run: |
          python3 tools/package_source360.py build/homenx360-source build/artifacts/HomeNX360-source.zip
          cp homenx360/NXE-REFERENCES.md build/artifacts/NXE-REFERENCES.md
          cp homenx360/STARTUP-REFERENCES.md build/artifacts/STARTUP-REFERENCES.md
          cp homenx360/GUIDE-REFERENCES.md build/artifacts/GUIDE-REFERENCES.md
          cp homenx360/SETTINGS-REFERENCES.md build/artifacts/SETTINGS-REFERENCES.md
          cp homenx360/DISCORD-GUIDE.md build/artifacts/DISCORD-GUIDE.md
          cp homenx360/AVATAR-GUIDE.md build/artifacts/AVATAR-GUIDE.md
          cp homenx360/UPDATER-GUIDE.md build/artifacts/UPDATER-GUIDE.md
          cp homenx360/AVATAR-CATALOG-SOURCES.json build/artifacts/AVATAR-CATALOG-SOURCES.json
          cp homenx360/avatar-signin-preview.png build/artifacts/avatar-signin-preview.png
          cp homenx360/avatar-creator-preview.png build/artifacts/avatar-creator-preview.png
          cp homenx360/RELEASE-NOTES.md build/artifacts/RELEASE-NOTES.md
          cd build/artifacts
          sha256sum * > SHA256SUMS.txt
      # The complete wardrobe makes the update/source archives large. Publish
      # directly from this tested build instead of copying them through Actions
      # artifact storage and a second runner.
      - name: Publish tested build files as a prerelease
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:-preview\.[0-9]+)?",os.environ["RELEASE_TAG"]), "Invalid release tag"'
          gh release create "$RELEASE_TAG" build/artifacts/* --target "$RELEASE_COMMIT" --draft --prerelease --title "HomeNX360 $RELEASE_TAG" --notes-file build/artifacts/RELEASE-NOTES.md
          gh release edit "$RELEASE_TAG" --draft=false
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'workflow_dispatch' || inputs.release_tag == ''
        with:
          name: HomeNX360-preview-and-validation
          path: |
            build/artifacts/HomeNX360-preview.nro
            build/artifacts/HomeNX360-Updater.nro
            build/artifacts/*.json
            build/artifacts/*.md
            build/artifacts/*.png
            build/artifacts/SHA256SUMS.txt
          retention-days: 14
